ekf_wheel_imu:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # IMU measurements (orientation + angular velocity + linear acceleration).
    # [[x,y,z],
    #  [roll,pitch,yaw],
    #  [vx,vy,vz],
    #  [vroll,vpitch,vyaw],
    #  [ax,ay,az]]
    imu0: /automobile/imu_raw
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    imu0_pose_rejection_threshold: 0.8
    imu0_twist_rejection_threshold: 0.8
    imu0_linear_acceleration_rejection_threshold: 0.8

    # Wheel odometry (x/y pose in odom frame).
    odom0: /automobile/wheel_imu_odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: true
    odom0_relative: false
    odom0_pose_rejection_threshold: 1.0

    # Wheel speed as twist (used for vx only).
    twist0: /automobile/wheel_twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  false, false,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10
    twist0_differential: false
    twist0_relative: false
    twist0_rejection_threshold: 1.0

    use_control: false

